<section
  #sectionRef
  class="velocity-section"
  [class.reduced-motion]="reducedMotion()"
>
  <div class="velocity-pin">
    <div class="stage-meta">
      <span class="stage-meta__rule"></span>
      <span>VELOCITY MARQUEE</span>
    </div>

    <div class="marquee-stack">
      @for (row of rows; track $index) {
        <div class="marquee">
          <div
            #track
            class="marquee__track marquee__track--{{ row.style }}"
          >
            <span class="marquee__sequence">
              @for (word of row.words; track word; let isLast = $last) {
                <span>{{ word }}</span>
                @if (!isLast) {
                  <i></i>
                }
              }
            </span>
          </div>
        </div>
      }
    </div>
  </div>
</section>
