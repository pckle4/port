<section class="section-purple py-12 sm:py-16 relative overflow-hidden"
  style="contain: layout style; scroll-margin-top: 96px;">

  <!-- Subtle glow accents -->
  <div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
    <div class="absolute top-0 left-0 w-[50%] h-[50%] rounded-full blur-[120px]" style="background-color: hsl(247, 91%, 55%);"></div>
    <div class="absolute bottom-0 right-0 w-[50%] h-[50%] rounded-full blur-[120px]" style="background-color: hsl(82, 86%, 40%);"></div>
  </div>

  <div class="container mx-auto px-5 sm:px-8 lg:px-16 relative z-10">
    <div class="max-w-7xl mx-auto">

      <!-- Massive Typography Header -->
      <div class="mb-16 sm:mb-20">
        <div stackReveal class="flex flex-col mb-6">
          <div class="overflow-hidden">
            <h2 class="stack-line translate-y-[110%] section-heading-massive m-0 text-white">
              SKILLS &
            </h2>
          </div>
          <div class="overflow-hidden">
            <h2 class="stack-line translate-y-[110%] section-heading-massive text-outline m-0 text-white">
              TECH.
            </h2>
          </div>
        </div>
        <p class="text-sm sm:text-base max-w-xl leading-relaxed text-white/60">
          My toolkit evolves continuously — but these are the technologies I reach for daily.
          From frontend frameworks to backend services, each chosen for reliability and developer experience.
        </p>
      </div>

      <div class="grid lg:grid-cols-12 gap-8 lg:gap-12 items-start">

        <!-- Skill Cards -->
        <div class="lg:col-span-7 order-2 lg:order-1">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">
            @for (category of skillCategories; track category.title) {
              <app-skill-card [category]="category"></app-skill-card>
            }
          </div>
        </div>

        <!-- Icon Cloud -->
        <div class="lg:col-span-5 order-1 lg:order-2 flex justify-center items-center">
          <div class="relative w-full max-w-[300px] sm:max-w-[380px] lg:max-w-[500px]">
            <div class="relative p-[1px] rounded-2xl overflow-hidden group">
              <div class="absolute inset-[-100%] animate-[spin_8s_linear_infinite]" style="background: conic-gradient(from 90deg at 50% 50%, transparent 50%, hsl(82, 86%, 62%) 100%);"></div>
              <div class="relative rounded-[15px] border border-white/10 p-4 w-full aspect-square flex items-center justify-center overflow-hidden" style="background-color: #111;">
                <app-icon-cloud class="w-full h-full"></app-icon-cloud>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
