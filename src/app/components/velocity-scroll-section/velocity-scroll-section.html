<section
  #sectionRef
  class="velocity-section"
  [class.reduced-motion]="reducedMotion()"
>
  <div class="velocity-pin">
    <div class="stage-meta">
      <span class="stage-meta__rule"></span>
      <span>VELOCITY MARQUEE</span>
    </div>

    <div class="marquee-stack">
      @for (row of rows; track $index) {
        <div class="marquee">
          <div
            #track
            class="marquee__track marquee__track--{{ row.style }} marquee__track--dir-{{ $index % 2 === 0 ? 'left' : 'right' }}"
          >
            <!-- Repeat 6 times for infinite looping safely across ultra-wide monitors -->
            @for (copy of [1, 2, 3, 4, 5, 6]; track copy) {
              <span class="marquee__sequence" style="padding-right: 0.6em;">
                @for (word of row.words; track word) {
                  <span>{{ word }}</span>
                  <i></i>
                }
              </span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
