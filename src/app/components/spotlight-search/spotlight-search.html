@if (isOpen) {
<div class="fixed inset-0 z-[100] flex items-start justify-center p-4 pt-[20vh]">
  <!-- Backdrop -->
  <div
    class="absolute inset-0 bg-black/20 dark:bg-black/40 backdrop-blur-sm"
    (click)="onBackdropClick()"
    #backdrop
    aria-hidden="true"
  ></div>

  <!-- Dialog -->
  <div
    #dialog
    role="dialog"
    aria-modal="true"
    aria-label="Search"
    class="relative z-[101] flex w-full max-w-2xl flex-col overflow-hidden rounded-[20px] bg-white/95 dark:bg-[#1c1c1e]/95 backdrop-blur-2xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.6)] border border-black/5 dark:border-white/10"
  >
    <!-- Input -->
    <div class="flex items-center gap-4 px-6 shrink-0 h-[72px]">
      <lucide-icon name="search" class="w-6 h-6 text-black/40 dark:text-white/40"></lucide-icon>
      <input
        #searchInput
        class="w-full bg-transparent text-2xl text-black dark:text-white outline-none placeholder:text-black/30 dark:placeholder:text-white/30 font-light"
        placeholder="Search..."
        [value]="query"
        (input)="onQueryChange($any($event.target).value)"
        spellcheck="false"
        autocomplete="off"
      />
    </div>

    <!-- Recommendations List -->
    @if (topMatches.length > 0 && query.trim().length > 0) {
      <div class="border-t border-black/5 dark:border-white/10 p-2 max-h-[300px] overflow-y-auto">
        @for (match of topMatches; track match.id; let i = $index) {
          <button
            type="button"
            (click)="executeMatch(match)"
            (mouseenter)="setSelectedIndex(i)"
            class="flex w-full items-center justify-between gap-4 rounded-[12px] px-4 py-4 text-left focus:outline-none transition-colors mb-1 last:mb-0"
            [ngClass]="i === selectedIndex ? 'bg-black/10 dark:bg-white/20' : 'hover:bg-black/5 dark:hover:bg-white/10 transparent'"
          >
            <div class="flex items-center gap-4">
              <div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary/20 shrink-0">
                <lucide-icon [name]="match.icon" class="h-5 w-5 text-primary"></lucide-icon>
              </div>
              <div>
                <div class="text-lg font-medium text-black dark:text-white">{{ match.label }}</div>
                <div class="text-sm text-black/50 dark:text-white/50">{{ getMatchDescription(match) }}</div>
              </div>
            </div>
            @if (i === selectedIndex) {
              <kbd class="hidden sm:flex items-center gap-1 rounded bg-black/10 dark:bg-white/10 px-2 py-1 text-xs font-medium text-black/60 dark:text-white/60">
                <span>↵</span> Enter
              </kbd>
            }
          </button>
        }
      </div>
    }
  </div>
</div>
}
