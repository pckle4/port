<section class="section-dark py-12 sm:py-16 relative overflow-hidden"
  style="contain: layout style; scroll-margin-top: 96px;">

  <div class="container mx-auto px-5 sm:px-8 lg:px-16 relative z-10">

    <!-- Massive Typography Header -->
    <div class="mb-16 sm:mb-20">
      <div stackReveal class="flex flex-col mb-6">
        <div class="overflow-hidden">
          <h2 class="stack-line translate-y-[110%] section-heading-massive m-0 text-white">
            MY
          </h2>
        </div>
        <div class="overflow-hidden">
          <h2 class="stack-line translate-y-[110%] section-heading-massive text-outline m-0 text-white">
            WORKS.
          </h2>
        </div>
      </div>
      <p class="text-sm sm:text-base max-w-xl leading-relaxed text-white/50">
        A curated selection of full-stack projects — each built with meticulous attention to 
        performance, accessibility, and design. From real-time collaboration tools to 
        AI-powered applications.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8 max-w-6xl">
      @for (project of projects; track project.id) {
      <app-project-card [project]="project"></app-project-card>
      }
    </div>

    <div class="mt-12 sm:mt-16 text-center lg:text-left">
      <a href="https://github.com/theanshshah" target="_blank" rel="noopener noreferrer"
        class="webflow-btn inline-flex">
        <span class="webflow-btn-text">View Full Archive</span>
        <div class="btn-icon-container">
          <div class="btn-bg-fill"></div>
          <div class="btn-icon-wrapper">
            <lucide-icon name="arrow-up-right" class="btn-icon-1"></lucide-icon>
            <lucide-icon name="arrow-up-right" class="btn-icon-2"></lucide-icon>
          </div>
        </div>
      </a>
    </div>
  </div>
</section>
