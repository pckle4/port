<div class="fixed top-0 left-0 w-full z-50 flex justify-center px-4 sm:px-6 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)]"
     [ngClass]="{'mt-2': isScrolled(), 'mt-4': !isScrolled()}">
  <header class="pointer-events-auto flex w-full items-center justify-between gap-4 rounded-[2rem] border border-white/10 dark:border-white/5 bg-[#1a1a2e]/95 dark:bg-[#0e1117]/95 backdrop-blur-xl shadow-2xl dark:shadow-[0_8px_32px_rgba(0,0,0,0.5)] transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)]"
          [ngClass]="{'max-w-4xl px-5 py-2': isScrolled(), 'max-w-7xl px-6 py-3': !isScrolled()}">
    
    <!-- Left: Logo -->
    <div class="relative cursor-pointer touch-feedback shrink-0 flex items-center" (click)="scrollTo('home')">
      <h1 class="font-sans font-bold tracking-tight text-white text-xl sm:text-2xl flex items-center gap-2">
        <lucide-icon name="layers" class="w-6 h-6 text-primary"></lucide-icon>
        Ansh
      </h1>
    </div>

    <!-- Center: Navigation -->
    <nav stackReveal class="hidden lg:flex items-center gap-8 text-sm font-medium text-white/90">
      <div class="overflow-hidden"><a class="stack-line translate-y-[110%] hover:text-white transition-opacity duration-200 cursor-pointer inline-block" (click)="scrollTo('about')">About</a></div>
      <div class="overflow-hidden"><a class="stack-line translate-y-[110%] hover:text-white transition-opacity duration-200 cursor-pointer inline-block" (click)="scrollTo('projects')">Projects</a></div>
      <div class="overflow-hidden"><a class="stack-line translate-y-[110%] hover:text-white transition-opacity duration-200 cursor-pointer inline-block" (click)="scrollTo('skills')">Skills</a></div>
      <div class="overflow-hidden"><a class="stack-line translate-y-[110%] hover:text-white transition-opacity duration-200 cursor-pointer inline-block" (click)="scrollTo('contact')">Contact</a></div>
    </nav>

    <!-- Right: CTA & Search -->
    <div class="flex items-center gap-4 shrink-0">
      
      <!-- Removed CTA Button per user request -->

      <!-- Search Icon -->
      <button (click)="openSearch()" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/10 transition-colors touch-feedback text-white" aria-label="Search">
        <lucide-icon name="search" class="w-[18px] h-[18px]"></lucide-icon>
      </button>
      
      <!-- Theme Switcher -->
      <label for="themeToggle" class="themeToggle st-sunMoonThemeToggleBtn touch-feedback text-white" aria-label="Toggle theme">
        <input type="checkbox" id="themeToggle" class="themeToggleInput" [checked]="isDark()" (change)="toggleTheme()" />
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" stroke="none">
          <mask id="moon-mask">
            <rect x="0" y="0" width="20" height="20" fill="white"></rect>
            <circle cx="11" cy="3" r="8" fill="black"></circle>
          </mask>
          <circle class="sunMoon" cx="10" cy="10" r="8" mask="url(#moon-mask)"></circle>
          <g>
            <circle class="sunRay sunRay1" cx="18" cy="10" r="1.5"></circle>
            <circle class="sunRay sunRay2" cx="14" cy="16.928" r="1.5"></circle>
            <circle class="sunRay sunRay3" cx="6" cy="16.928" r="1.5"></circle>
            <circle class="sunRay sunRay4" cx="2" cy="10" r="1.5"></circle>
            <circle class="sunRay sunRay5" cx="6" cy="3.1718" r="1.5"></circle>
            <circle class="sunRay sunRay6" cx="14" cy="3.1718" r="1.5"></circle>
          </g>
        </svg>
      </label>
    </div>
  </header>
</div>

@defer (when isSearchOpen()) {
  <app-spotlight-search [isOpen]="isSearchOpen()" (close)="closeSearch()"></app-spotlight-search>
}
