<header class="site-header" id="top">
  <nav class="nav-shell" aria-label="Primary navigation">
    <a routerLink="/" class="brand" aria-label="Ansh Shah home">
      <div style="width: 36px; height: 36px; position: relative; margin-right: 4px;">
        <img class="brand-logo" src="/logo%201.svg" alt="NW Logo" style="position: absolute; top: 70%; left: 70%; width: 100%; height: 100%; transform: translate(-50%, -50%) scale(3.5);" />
      </div>
      <span style="margin-left: 21px; z-index: 1;">Ansh Shah</span>
    </a>
    <div class="nav-links" [class.nav-links--open]="menuOpen()">
      <a href="/#about" (click)="navigateTo('about', $event)">About</a>
      <button type="button" (click)="navigateTo('projects')">
        Projects <span aria-hidden="true">↘</span>
      </button>
      <a href="/#skills" (click)="navigateTo('skills', $event)">Skills</a>
      <a href="/#contact" (click)="navigateTo('contact', $event)">Contact</a>
      <a routerLink="/resume" routerLinkActive="active-link" (click)="menuOpen.set(false)">Resume <span aria-hidden="true">↗</span></a>
    </div>
    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation"
      (click)="menuOpen.update((value) => !value)"
    >
      <span></span><span></span>
    </button>
  </nav>
</header>
