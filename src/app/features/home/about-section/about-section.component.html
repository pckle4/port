<section class="about-section" id="about" aria-labelledby="about-title">
  <div class="about-section__content">
    <p class="about-section__eyebrow">{{ profile.eyebrow }}</p>
    <h2 id="about-title">{{ profile.heading }}</h2>
    <p class="about-section__lead">{{ profile.introduction }}</p>
    <p class="about-section__story">{{ profile.story }}</p>
    <ul class="about-section__roles" aria-label="Current focus">
      @for (role of profile.roles; track role) {
        <li>{{ role }}</li>
      }
    </ul>
    <p class="about-section__workflow-label" id="workflow-title">How I work</p>
  </div>
  <figure class="about-section__graphic" aria-labelledby="workflow-title">
    <img
      src="/illustrations/about-workflow.svg"
      width="4096"
      height="4096"
      alt="A three-step workflow: understand the problem, build the useful version, and refine the details."
      loading="lazy"
      decoding="async"
      draggable="false"
    />
  </figure>
</section>
