<section class="portfolio-hero" aria-labelledby="portfolio-hero-title">
  <div class="portfolio-hero__top">
    <div class="portfolio-hero__content">
      <p class="portfolio-hero__availability"><span class="portfolio-hero__availability-dot"
          aria-hidden="true"></span><span class="portfolio-hero__availability-label">Open for Freelancing</span></p>
      <p class="portfolio-hero__eyebrow">Technical student &middot; Software builder</p>
      <h1 id="portfolio-hero-title">I&rsquo;m Ansh Shah.<br />I build <mark>useful software.</mark></h1>
      <p class="portfolio-hero__lede">I turn ideas into thoughtful digital products&mdash;from the first technical
        decision to an interface people can actually use.</p>
      <div class="portfolio-hero__actions">
        <button class="portfolio-hero__button portfolio-hero__button--primary" type="button"
          (click)="scrollTo('product')">Explore projects <span aria-hidden="true">&rarr;</span></button>
        <button class="portfolio-hero__button portfolio-hero__button--secondary" type="button"
          (click)="scrollTo('contact')">Let&rsquo;s connect</button>
      </div>
      <ul class="portfolio-hero__focus" aria-label="Technical interests">
        <li>Web development</li>
        <li>Product thinking</li>
        <li>Practical problem solving</li>
      </ul>
    </div>

    <figure class="portfolio-hero__profile">
      <img src="/illustrations/hero-technical-illustration.svg" width="2656" height="2367"
        alt="Technical illustration supporting Ansh Shah's software portfolio" fetchpriority="high" decoding="async" />
    </figure>
  </div>

  <figure class="portfolio-hero__art">
    <img src="/illustrations/hero-collaboration.svg" width="2477" height="1494"
      alt="A team collaborating around a project board and laptop" loading="lazy" decoding="async" />
  </figure>
</section>
