<!-- Sticky Hero Section that stays in background (Uses pure CSS since it's the very first element) -->
<div class="sticky top-0 h-screen w-full overflow-hidden" style="z-index: 0;">
  <app-hero-section id="home"></app-hero-section>
</div>

<!-- Rest of the content slides over the hero and then stacks natively when scrolling finishes -->
<div class="relative z-10 bg-transparent">
  
  <div id="about" appStackSection stackPause="15vh" class="relative w-full shadow-[0_-10px_40px_rgba(0,0,0,0.3)] z-[10]">
    <app-about-section></app-about-section>
  </div>
  
  <div id="projects" appStackSection stackPause="35vh" class="relative w-full shadow-[0_-10px_40px_rgba(0,0,0,0.4)] z-[20]">
    <app-projects-section></app-projects-section>
  </div>

  <div id="skills" appStackSection stackPause="20vh" class="relative w-full shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-[30]">
    <app-skills-section></app-skills-section>
  </div>
  
  <div id="contact" appStackSection stackPause="20vh" class="relative w-full shadow-[0_-10px_40px_rgba(0,0,0,0.6)] z-[40]">
    <app-contact-section></app-contact-section>
  </div>
  
  <!-- Velocity Scroll doesn't need to be pinned since it's the last section -->
  <div class="relative w-full shadow-[0_-10px_40px_rgba(0,0,0,0.7)] z-[50]">
    <app-velocity-scroll-section></app-velocity-scroll-section>
  </div>
  
</div>
